<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Три в ряд</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas для игры -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Все UI экраны поверх canvas -->
    <div id="menuScreen" class="ui-screen active">
        <div class="ui-content">
            <h1>ТРИ В РЯД</h1>
            <div class="ui-buttons">
                <button id="startBtn" class="ui-btn">Начать игру</button>
                <button id="scoresBtn" class="ui-btn">Таблица рекордов</button>
                <button id="instructionsBtn" class="ui-btn">Инструкция</button>
            </div>
        </div>
    </div>
    
    <div id="pauseScreen" class="ui-screen">
        <div class="ui-content">
            <h2>ПАУЗА</h2>
            <div class="ui-buttons">
                <button id="resumeBtn" class="ui-btn">Продолжить</button>
                <button id="restartBtn" class="ui-btn">Начать заново</button>
                <button id="menuFromPauseBtn" class="ui-btn">В меню</button>
            </div>
        </div>
    </div>
    
    <div id="scoresScreen" class="ui-screen">
        <div class="ui-content">
            <h2>ТАБЛИЦА РЕКОРДОВ</h2>
            <div id="scoresList" class="scores-list"></div>
            <button id="backFromScoresBtn" class="ui-btn">Назад</button>
        </div>
    </div>
    
    <div id="gameOverScreen" class="ui-screen">
        <div class="ui-content">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <div class="final-score">Очки: <span id="finalScore">0</span></div>
            <input type="text" id="playerName" placeholder="Ваше имя">
            <div class="ui-buttons">
                <button id="saveScoreBtn" class="ui-btn">Сохранить</button>
                <button id="playAgainBtn" class="ui-btn">Играть снова</button>
                <button id="menuFromGameOverBtn" class="ui-btn">В меню</button>
            </div>
        </div>
    </div>
    
    <div id="instructionsScreen" class="ui-screen">
        <div class="ui-content">
            <h2>ИНСТРУКЦИЯ</h2>
            <div class="instructions">
                <p>1. Кликните на фигуру, затем на соседнюю</p>
                <p>2. Составляйте линии из 3+ одинаковых фигур</p>
                <p>3. У вас 30 ходов и 2 минуты!</p>
            </div>
            <button id="backFromInstructionsBtn" class="ui-btn">Назад</button>
        </div>
    </div>
    
    <!-- Игровой HUD (всегда поверх canvas) -->
    <div id="gameHUD" class="game-hud">
        <div class="hud-stats">
            <div class="stat">Очки: <span id="score">0</span></div>
            <div class="stat">Ходы: <span id="moves">30</span></div>
            <div class="stat">Время: <span id="timer">02:00</span></div>
            <div id="comboDisplay" class="combo">Комбо: x1</div>
        </div>
        <button id="pauseBtn" class="hud-btn">Пауза</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
